services:
  app:
    build:
      context: .
      target: app
      args:
        VITE_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    image: tirtanirwana-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Tirta Nirwana"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-tirtanirwana}
      DB_USERNAME: ${DB_USERNAME:-tirtanirwana}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@tirtanirwana.id}
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tirtanirwana}
      MYSQL_USER: ${DB_USERNAME:-tirtanirwana}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:
